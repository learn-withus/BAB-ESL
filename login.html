<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bab ESL Pro - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
            position: relative;
        }

        /* Animated diagonal background wash layer */
        body::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: url('images/bab.png');
            background-repeat: repeat;
            background-size: 300px auto; /* Size of the repeating watermark logo */
            opacity: 0.04; /* Very faint/washed look so it doesn't distract */
            pointer-events: none;
            animation: diagonalWash 25s linear infinite;
        }

        @keyframes diagonalWash {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(150px, 150px); /* Drifts from upper-left to lower-right */
            }
        }

        .login-card { 
            background: white; 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 350px; 
            text-align: center; 
            position: relative; 
            z-index: 1; /* Keeps card above the moving background */
        }
        
        /* Logo styling for the image */
        .logo { margin-bottom: 20px; }
        .logo img { 
            max-width: 140px; 
            height: auto; 
            display: block; 
            margin: 0 auto; 
        }

        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        #error-msg { color: #ef4444; font-size: 14px; margin-top: 10px; display: none; }
        .auth-footer { margin-top: 20px; font-size: 13px; color: #64748b; }
        .auth-footer a { color: #2563eb; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="login-card">
        <!-- Added your bab.png logo here -->
        <div class="logo">
            <img src="images/bab.png" alt="BAB ESL Pro Logo">
        </div>
        
        <!-- Wrapped inputs and button in a form element -->
        <form id="login-form" onsubmit="handleLogin(event)">
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button type="submit">Login</button>
        </form>
        <p id="error-msg">Invalid username or password</p>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzKgmrpwFccCctJWLGi0TiFkIBlfU-3RtJxXp9noikDEX9TW2MBvRNgv8I-H5vht7os/exec";

        // Auto-redirect if already logged in
        if (localStorage.getItem('isLoggedIn') === 'true') {
            redirectBasedOnRole(String(localStorage.getItem('userRole')));
        }

        function redirectBasedOnRole(role) {
            const cleanRole = String(role).trim();
            if (cleanRole === "3") {
                window.location.replace("admin-dashboard.html");
            } else if (cleanRole === "2") {
                window.location.replace("index.html");
            } else {
                window.location.replace("user-dashboard.html");
            }
        }

        function handleLogin(event) {
            // Prevent the default form submission page reload
            if (event) event.preventDefault();

            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const error = document.getElementById('error-msg');
            const btn = document.querySelector('button');

            if (!user || !pass) {
                error.innerText = "Please enter both fields";
                error.style.display = 'block';
                return;
            }

            error.style.display = 'none'; // Hide previous error if any
            btn.innerText = "Checking...";
            btn.disabled = true;

            const callbackName = 'google_callback_' + Math.round(Math.random() * 1000000);

            window[callbackName] = function(result) {
                if (result.status === "success") {
                    const assignedRole = String(result.role || "1").trim();
                    
                    // Save user session details AND their assigned books!
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('teacherName', result.name);
                    localStorage.setItem('userRole', assignedRole);
                    localStorage.setItem('books', result.books || ""); 
                    
                    redirectBasedOnRole(assignedRole);
                } else {
                    error.innerText = "Invalid username or password";
                    error.style.display = 'block';
                    btn.innerText = "Login";
                    btn.disabled = false;
                }
                document.body.removeChild(script);
                delete window[callbackName];
            };

            const script = document.createElement('script');
            script.src = `${API_URL}?action=login&username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}&callback=${callbackName}`;
            document.body.appendChild(script);

            script.onerror = () => {
                error.innerText = "Connection failed. Check Deployment URL.";
                error.style.display = 'block';
                btn.innerText = "Login";
                btn.disabled = false;
            };
        }
    </script>
</body>
</html>
